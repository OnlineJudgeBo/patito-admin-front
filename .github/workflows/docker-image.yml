name: Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_selenium:
        description: 'Ejecutar pruebas Selenium antes de publicar la imagen'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Tags de Cucumber'
        required: false
        default: '@admin'
      env:
        description: 'Archivo application.properties'
        required: false
        default: 'dev'
      reset_db:
        description: 'Restablecer la base de datos antes de las pruebas'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/onlinejudgebo/patito-admin-ui

jobs:
  selenium-tests:
    name: Run Selenium BDD tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_selenium == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Trigger and wait for automation tests
        env:
          GH_TOKEN: ${{ secrets.PATITO_AUTOMATION_TOKEN }}
          REPO: OnlineJudgeBo/patito-automation-test
          WORKFLOW: selenium-tests.yml
          TAGS: ${{ inputs.tags || '@admin' }}
          ENV_NAME: ${{ inputs.env || 'dev' }}
          RESET_DB: ${{ inputs.reset_db }}
        run: |
          set -euo pipefail
          BEFORE_IDS=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 20 --json databaseId --jq '.[].databaseId')
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref main \
            -f env="$ENV_NAME" -f tags="$TAGS" -f reset_db="$RESET_DB"

          RUN_ID=""
          for attempt in $(seq 1 20); do
            sleep 10
            CURRENT_IDS=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 20 --json databaseId --jq '.[].databaseId')
            for id in $CURRENT_IDS; do
              if ! grep -qx "$id" <<< "$BEFORE_IDS"; then
                RUN_ID="$id"
                break 2
              fi
            done
          done

          test -n "$RUN_ID" || { echo '::error::No se pudo identificar la ejecución de Selenium.'; exit 1; }
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status

  docker-image:
    name: Build Docker image
    needs: selenium-tests
    if: ${{ always() && (needs.selenium-tests.result == 'success' || needs.selenium-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_PATH=${{ vars.ADMIN_UI_BASE_PATH || '/' }}
            VITE_LOGOUT_URL=${{ vars.PATITO_WEB_PUBLIC_URL || 'http://localhost:8082' }}/oj/logout.php
            VITE_API_URL=${{ vars.ADMIN_API_PUBLIC_URL || 'http://localhost:8088/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
